id: TPRM-MON-001-rubric
lab: TPRM-MON-001
scale: [competent, developing, needs_work, not_applicable]
criteria:
  - id: completeness
    prompt: Three workpapers filled.
  - id: evidence_usage
    prompt: Dates the SOC cover. Uses Slack for InboxRelay and Sketchboard.
  - id: risk_identification
    prompt: Expired SOC, new subprocessor, leftover SSO.
  - id: control_mapping
    prompt: Monitoring vs intake vs disabling production email.
  - id: consistency
    prompt: Memo actions match findings.
  - id: professional_quality
    prompt: Sendable quarterly memo.
  - id: escalation_judgment
    prompt: Does not disable CloudMail. Does recommend Sketchboard SSO removal.
  - id: human_gate
    prompt: User owns residual. Does not invent a current SOC.
fail_if:
  - disables_cloudmail
  - invents_current_soc
